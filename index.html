<title>Fiche de travaux — تعبئة تلقائية</title>
<style>
:root{color-scheme:light dark;--bg:#f7f6f2;--card:#fff;--ink:#1f2328;--mut:#6b7280;--line:#e3e0d8;--acc:#0f766e;--accink:#fff;--we:#fdecec;--red:#c62828;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14161a;--card:#1d2025;--ink:#eceff3;--mut:#9aa3af;--line:#2c3138;--acc:#2dd4bf;--accink:#04201c;--we:#2a1b1d;--red:#ef6b6b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14161a;--card:#1d2025;--ink:#eceff3;--mut:#9aa3af;--line:#2c3138;--acc:#2dd4bf;--accink:#04201c;--we:#2a1b1d;--red:#ef6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,"Noto Naskh Arabic",Tahoma,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 24px}
.top{display:flex;align-items:center;gap:10px;position:relative;margin:6px 0 2px}
.top h1{margin:0}
.ic{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0}
#menu{position:absolute;top:100%;inset-inline-start:0;z-index:15;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:230px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#menu[hidden],#toast[hidden]{display:none}
#menu button{display:block;width:100%;text-align:start;padding:11px 12px;border:0;background:none;color:var(--ink);border-radius:8px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;z-index:30}
h1{font-size:22px;margin:6px 0 2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:grid;grid-template-columns:2fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--mut)}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-top:3px}
input[type=checkbox]{width:20px;height:20px;margin:0}
textarea{resize:vertical}
details summary{cursor:pointer;font-weight:600}
details .g2,details .g3{margin-top:10px}
.g2,.g3,.g4{display:grid;gap:8px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:1fr 1fr}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;scroll-margin-top:12px}
.day.we{background:var(--we)}
.dh{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;cursor:pointer}
.dh b{font-size:18px;min-width:26px}
.dh i{font-style:normal;font-weight:700;min-width:26px;text-align:center;border-radius:6px;padding:0 6px;background:var(--bg)}
.we .dh i{color:var(--red)}
.dh span{flex:1;color:var(--mut);font-size:13px;white-space:normal;word-break:break-word}
.fm{padding:4px 12px 14px;border-top:1px dashed var(--line)}
.fm h4{margin:12px 0 6px;font-size:13px}
.fm label+label,.fm .g2+label{margin-top:8px}
.cks{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px}
.ck{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:14px}
.act{display:flex;gap:8px;margin-top:14px}
button{font:inherit;cursor:pointer}
.act button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.act .gh{color:var(--red)}
.bar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
#tot{flex:1;font-size:16px;color:var(--ink);text-align:right;line-height:1.4}
#msg{display:block;margin-top:2px}
#dl{background:var(--acc);color:var(--accink);border:0;border-radius:12px;padding:12px 16px;font-weight:700}
#dl:disabled{opacity:.6}
.g3 .ck{margin-top:24px}details.sub{margin-top:10px}.fm details summary{font-size:13px;color:var(--mut)}
.fm details.p2>summary{width:fit-content;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--card);color:var(--ink)}
#pvb{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px}
#pv{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#pv[hidden]{display:none}
.pvh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.pvh button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 14px}
.pvi{font-size:12px;padding:8px 14px;color:var(--mut);direction:ltr;text-align:left}
#pvt{flex:1;overflow:auto;background:#fff;color:#000;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px))}
#pvt table{border-collapse:collapse;font-size:12px;min-width:780px;direction:ltr;background:#fff;color:#000}
#pvt th,#pvt td{border:1px solid #b5b5b5;padding:4px 6px;text-align:center;white-space:nowrap}
#pvt th{background:#f2f2f2;font-weight:600}
#pvt td.tw{white-space:normal;min-width:150px;text-align:start}
#pvt tr.we td:nth-child(2){color:#c00000;font-weight:700}
#pvt tr.tot td{font-weight:700;background:#f2f2f2}
.day.rd .dh span,.day.we .dh span{color:var(--red)}
.day.op{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.day.today .dh b{background:var(--acc);color:var(--accink);border-radius:8px;padding:0 6px;min-width:0}
.sg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.sg:empty{display:none}
.chip{border:1px solid var(--acc);color:var(--acc);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px}
#pvt tr.red td{color:#c00000}
#pvt tr.red:not(.we) td:nth-child(-n+2){color:#000}
#pvt tr.we td:nth-child(-n+2){color:#c00000;font-weight:700}
.note{font-size:12.5px;color:var(--mut);margin:4px 2px 12px}
.ckrow{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink)}
/* alignment fix */
.g2>label,.g3>label,.g4>label,.cks>label{margin-top:0}
.g2,.g3,.g4{align-items:end}
.g2,.g3,.g4{grid-template-columns:repeat(var(--c),minmax(0,1fr))}
.g2{--c:2}.g3{--c:3}.g4{--c:2}
input:not([type=checkbox]),select{height:44px;box-sizing:border-box}
.g3 .ck{margin-top:0;height:44px;justify-content:center;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.cks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cks .ck{margin-top:0;justify-content:center;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
</style>
</head>
<body>
<main>
<div class="top"><button id="mn" class="ic" aria-label="menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><h1>Fiche de travaux</h1>
<div id="menu" hidden><button id="ma">عرض الأشهر السابقة بمدخلاتها</button><button id="mx">حفظ نسخة احتياطية في الهاتف</button><button id="mi">استرجاع نسخة</button></div></div>
<input type="file" id="imf" accept=".json,application/json" hidden>
<div id="toast" hidden></div>
<div id="archive" hidden style="position:fixed;inset:0;z-index:25;background:var(--bg);padding:20px;overflow:auto">
  <div class="card" style="max-width:520px;margin:20px auto">
    <h3 style="margin-top:0">الأشهر السابقة المحفوظة</h3>
    <p class="sub">اختار الشهر باش تشوف المدخلات ديالو. البيانات كتتحفظ تلقائياً فهاد الهاتف.</p>
    <label>الشهر<select id="archivemo"></select></label>
    <div class="act"><button id="archivego">عرض المدخلات</button><button id="archiveclose">إغلاق</button></div>

function setCell(xml,ref,val,style){
  const re=new RegExp('<c r="'+ref+'"((?:\\s+[\\w:]+="[^"]*")*)\\s*(?:/>|>[\\s\\S]*?</c>)');
  return xml.replace(re,(m,attrs)=>{
    const s=style!=null?style:(attrs.match(/\ss="(\d+)"/)||[])[1];
    const sa=s!=null?' s="'+s+'"':'';
    if(val===''||val==null)return '<c r="'+ref+'"'+sa+'/>';
    if(typeof val==='number')return '<c r="'+ref+'"'+sa+'><v>'+val+'</v></c>';
    return '<c r="'+ref+'"'+sa+' t="inlineStr"><is><t xml:space="preserve">'+esc(val)+'</t></is></c>';
  });
}
function setCalc(xml,ref,v){

}
function hrs(D,wd){if(isC(D))return 0;let s=0;for(let i=0;i<8;i+=2){const a=g(D,i),b=g(D,i+1);if(a&&b){const sm=(+a.slice(0,2))*60+(+a.slice(3,5));let em=(+b.slice(0,2))*60+(+b.slice(3,5));if(em<sm)em+=1440;s+=Math.max(0,em-(wd===0||wd===6?sm:Math.max(sm,1020)))}}return rd(s/60)}

function has(D){return Object.keys(D).some(k=>D[k])}
function fillSheet(xml,y,m,days,ex,set,rm){
  const n=new Date(y,m+1,0).getDate(),T={K:0,L:0,M:0,R:0,S:0,T:0,U:0};let nRC=0;
  for(let d=1;d<=31;d++){
    const r=12+d,ok=d<=n,w=new Date(y,m,d).getDay(),D=ok?(days[d]||{}):{};
    xml=setCell(xml,'A'+r,ok?String(d):'');
    xml=setCell(xml,'B'+r,ok?DOW[w]:'',ok&&(w===0||w===6)?(rm&&rm.br!=null?rm.br:36):(rm&&rm.bk!=null?rm.bk:26));
    'CDEFGHIJ'.split('').forEach((c,i)=>{xml=setCell(xml,c+r,tt(D,i))});
    const kv=hrs(D,w);if(kv)T.K+=kv;xml=setCell(xml,'K'+r,kv||'');
    const isrc=ok&&isRC(D);if(isrc)nRC++;const lv=isrc?-8.5:(kv?rd(kv*(spc(D)&&spc(D)[3]?1:(w===0?1.75:1.5))):0);if(lv)T.L+=lv;xml=setCell(xml,'L'+r,lv||'');
    const pv=D.m?1:0;if(pv)T.M+=pv;xml=setCell(xml,'M'+r,pv||'');
    xml=setCell(xml,'N'+r,D.w||'');
    const q=num(D.q);xml=setCell(xml,'Q'+r,q==null?(D.q||''):q);
    [['R','c1'],['S','c2'],['T','c3'],['U','c4']].forEach(([c,k])=>{if(D[k])T[c]++;xml=setCell(xml,c+r,D[k]?1:'')});
    if(ok&&rm&&(isR(D)||w===0||w===6))'ABCDEFGHIJKLMNOPQRSTUV'.split('').forEach(c=>{if((c==='A'||c==='B')&&w!==0&&w!==6)return;xml=restyle(xml,c+r,rm)});
  }
  Object.keys(T).forEach(c=>{xml=setCalc(xml,c+'44',rd(T[c]))});
  xml=setCalc(xml,'N48',rd(T.L));xml=setCalc(xml,'O48',rd(T.K));
  xml=setCell(xml,'R4',MONTHS[m]+' '+y);
  xml=setCell(xml,'R5',set.ss||'');xml=setCell(xml,'S6',set.sk||'');
  xml=setCell(xml,'C8','                Nom et Prénom : '+set.sn+'                        Mle : '+set.sm+'                             Classement : '+set.sc+'    ');
  [['C48','c'],['E48','e'],['G48','g'],['I48','i'],['K48','k']].forEach(([ref,k])=>{xml=setCell(xml,ref,ex[k]||'_')});
  const rc=num(ex.rc);xml=setCell(xml,'P48',nRC?nRC:(rc==null?(ex.rc||''):rc));
  xml=setCell(xml,'N44','Kilométrage:'+(ex.km?' '+ex.km:''));
  xml=setCell(xml,'N45','Puissance fiscale'+(ex.pf?' '+ex.pf:''));
  return xml;
}
function restyle(xml,ref,map){
  return xml.replace(new RegExp('(<c r="'+ref+'"(?:\\s+[\\w:]+="[^"]*")*?\\s)s="(\\d+)"'),(m,a,s)=>a+'s="'+(map[s]!=null?map[s]:s)+'"');
}
function redMap(sx,st){
  const xl=st.match(/<cellXfs[^>]*>([\s\S]*?)<\/cellXfs>/)[1].match(/<xf\b[^>]*?\/>|<xf\b[^>]*>[\s\S]*?<\/xf>/g);
  const fl=st.match(/<fonts[^>]*>([\s\S]*?)<\/fonts>/)[1].match(/<font\b[^>]*?\/>|<font\b[^>]*>[\s\S]*?<\/font>/g);
  const used=new Set();
  const re=/<c r="[A-V](?:1[3-9]|2\d|3\d|4[0-3])"((?:\s+[\w:]+="[^"]*")*)/g;let m;
  while((m=re.exec(sx))){const s=(m[1].match(/\ss="(\d+)"/)||[])[1];if(s!=null)used.add(+s);}
  let br=null,bk=null;
  const rb=/<c r="B(?:1[3-9]|2\d|3\d|4[0-3])"((?:\s+[\w:]+="[^"]*")*)/g;let q;
  while((q=rb.exec(sx))){const s=(q[1].match(/\ss="(\d+)"/)||[])[1];if(s==null||!xl[+s])continue;const fid=+xl[+s].match(/fontId="(\d+)"/)[1];if(/FFFF0000/.test(fl[fid])){if(br==null)br=+s}else if(bk==null)bk=+s;}
  const nf=[],nx=[],map={},fm={};
  used.forEach(id=>{
    const x=xl[id];if(!x)return;
    const fid=+x.match(/fontId="(\d+)"/)[1];
    if(!(fid in fm)){let f=fl[fid];
      f=/<color\b[^>]*\/>/.test(f)?f.replace(/<color\b[^>]*\/>/,'<color rgb="FFFF0000" />'):f.replace(/(<sz\b[^>]*\/>)/,'$1<color rgb="FFFF0000" />');
      fm[fid]=fl.length+nf.length;nf.push(f);}
    map[id]=xl.length+nx.length;nx.push(x.replace(/fontId="\d+"/,'fontId="'+fm[fid]+'"'));
  });
  let out=st.replace(/(<fonts\b[^>]*count=")\d+(")/,'$1'+(fl.length+nf.length)+'$2').replace('</fonts>',nf.join('')+'</fonts>');
  out=out.replace(/(<cellXfs\b[^>]*count=")\d+(")/,'$1'+(xl.length+nx.length)+'$2').replace('</cellXfs>',nx.join('')+'</cellXfs>');
  map.br=br;map.bk=bk;
  return {styles:out,map};
}
function stripVisa(dx){
  return dx.replace(/<xdr:twoCellAnchor[\s\S]*?<\/xdr:twoCellAnchor>/g,a=>{
    const c=a.match(/<xdr:from><xdr:col>(\d+)<\/xdr:col>[\s\S]*?<xdr:row>(\d+)<\/xdr:row>/);
    return c&&c[1]==='21'&&['12','13','43'].includes(c[2])?'':a;
  });
}

  $('#mo').value=st.m;$('#yr').value=st.y;
  st.set={...DEF,...(ls.get('ft:set')||{})};if(st.set.sc==='05/09/07'||st.set.sc==='05/10/07')st.set.sc=DEF.sc;
  document.querySelectorAll('[data-set]').forEach(i=>{i.value=st.set[i.dataset.set]||''});
  st.open=now.getDate();load();render();
  setTimeout(()=>{const e=$('#day'+st.open);if(e)e.scrollIntoView({block:'start'})},80);
})();
</script>
